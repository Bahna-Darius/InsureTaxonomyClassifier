<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="900" height="500" fill="#f8f9fa" rx="10" ry="10"/>
  
  <!-- Title -->
  <text x="450" y="40" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">InsureTaxonomyClassifier Architecture</text>
  
  <!-- Input Section -->
  <rect x="50" y="100" width="160" height="120" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="8" ry="8"/>
  <text x="130" y="130" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#1565c0">Input</text>
  
  <rect x="70" y="150" width="120" height="25" fill="#bbdefb" stroke="#2196f3" stroke-width="1" rx="4" ry="4"/>
  <text x="130" y="167" font-family="Arial" font-size="12" text-anchor="middle" fill="#0d47a1">CSV File</text>
  
  <rect x="70" y="185" width="120" height="25" fill="#bbdefb" stroke="#2196f3" stroke-width="1" rx="4" ry="4"/>
  <text x="130" y="202" font-family="Arial" font-size="12" text-anchor="middle" fill="#0d47a1">JSON Payload</text>
  
  <!-- Preprocessing Section -->
  <rect x="250" y="100" width="160" height="120" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" rx="8" ry="8"/>
  <text x="330" y="130" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#2e7d32">Preprocessing</text>
  
  <rect x="270" y="150" width="120" height="25" fill="#c8e6c9" stroke="#4caf50" stroke-width="1" rx="4" ry="4"/>
  <text x="330" y="167" font-family="Arial" font-size="12" text-anchor="middle" fill="#1b5e20">Cleaning</text>
  
  <rect x="270" y="185" width="120" height="25" fill="#c8e6c9" stroke="#4caf50" stroke-width="1" rx="4" ry="4"/>
  <text x="330" y="202" font-family="Arial" font-size="12" text-anchor="middle" fill="#1b5e20">Lemmatization</text>
  
  <!-- Model Inference Section -->
  <rect x="450" y="80" width="200" height="160" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="8" ry="8"/>
  <text x="550" y="110" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#e65100">Model Inference</text>
  
  <!-- Standard Model -->
  <rect x="470" y="130" width="160" height="40" fill="#ffe0b2" stroke="#ff9800" stroke-width="1" rx="4" ry="4"/>
  <text x="550" y="155" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#e65100">HuggingFace Model</text>
  <text x="550" y="170" font-family="Arial" font-size="10" text-anchor="middle" fill="#e65100">(model.py)</text>
  
  <!-- ONNX Model -->
  <rect x="470" y="180" width="160" height="40" fill="#ffe0b2" stroke="#ff9800" stroke-width="1" rx="4" ry="4"/>
  <text x="550" y="205" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#e65100">ONNX Model</text>
  <text x="550" y="220" font-family="Arial" font-size="10" text-anchor="middle" fill="#e65100">(model_onnx.py)</text>
  
  <!-- Output Section -->
  <rect x="690" y="100" width="160" height="120" fill="#e8eaf6" stroke="#3f51b5" stroke-width="2" rx="8" ry="8"/>
  <text x="770" y="130" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#283593">Output</text>
  
  <rect x="710" y="150" width="120" height="25" fill="#c5cae9" stroke="#3f51b5" stroke-width="1" rx="4" ry="4"/>
  <text x="770" y="167" font-family="Arial" font-size="12" text-anchor="middle" fill="#1a237e">CSV with Labels</text>
  
  <rect x="710" y="185" width="120" height="25" fill="#c5cae9" stroke="#3f51b5" stroke-width="1" rx="4" ry="4"/>
  <text x="770" y="202" font-family="Arial" font-size="12" text-anchor="middle" fill="#1a237e">JSON Response</text>
  
  <!-- Flow Arrows -->
  <path d="M210 160 L250 160" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M410 160 L450 160" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M650 160 L690 160" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- API Controller -->
  <rect x="350" y="300" width="200" height="60" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" rx="8" ry="8"/>
  <text x="450" y="335" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#4a148c">API Controller</text>
  <text x="450" y="355" font-family="Arial" font-size="12" text-anchor="middle" fill="#4a148c">(api.py)</text>
  
  <!-- Config -->
  <rect x="600" y="300" width="200" height="60" fill="#fce4ec" stroke="#e91e63" stroke-width="2" rx="8" ry="8"/>
  <text x="700" y="335" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#880e4f">Configuration</text>
  <text x="700" y="355" font-family="Arial" font-size="12" text-anchor="middle" fill="#880e4f">(config.py, config.yaml)</text>
  
  <!-- Utils -->
  <rect x="100" y="300" width="200" height="60" fill="#e0f7fa" stroke="#00bcd4" stroke-width="2" rx="8" ry="8"/>
  <text x="200" y="335" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#006064">Utilities</text>
  <text x="200" y="355" font-family="Arial" font-size="12" text-anchor="middle" fill="#006064">(utils.py)</text>
  
  <!-- Flow Control Arrows -->
  <path d="M450 300 L450 250" stroke="#9c27b0" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="465" y="280" font-family="Arial" font-size="10" fill="#9c27b0">Controls</text>
  
  <path d="M600 330 L550 330" stroke="#e91e63" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="565" y="320" font-family="Arial" font-size="10" fill="#e91e63">Settings</text>
  
  <path d="M300 330 L350 330" stroke="#00bcd4" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="315" y="320" font-family="Arial" font-size="10" fill="#00bcd4">Support</text>
  
  <!-- Legend -->
  <rect x="250" y="400" width="400" height="80" fill="white" stroke="#ccc" stroke-width="1" rx="5" ry="5"/>
  <text x="450" y="420" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Legend</text>
  
  <!-- Legend Items -->
  <rect x="270" y="430" width="15" height="15" fill="#e3f2fd" stroke="#2196f3" stroke-width="1"/>
  <text x="290" y="443" font-family="Arial" font-size="12" fill="#333" text-anchor="start">Input Processing</text>
  
  <rect x="270" y="450" width="15" height="15" fill="#e8f5e9" stroke="#4caf50" stroke-width="1"/>
  <text x="290" y="463" font-family="Arial" font-size="12" fill="#333" text-anchor="start">Data Preprocessing</text>
  
  <rect x="430" y="430" width="15" height="15" fill="#fff3e0" stroke="#ff9800" stroke-width="1"/>
  <text x="450" y="443" font-family="Arial" font-size="12" fill="#333" text-anchor="start">Model Components</text>
  
  <rect x="430" y="450" width="15" height="15" fill="#e8eaf6" stroke="#3f51b5" stroke-width="1"/>
  <text x="450" y="463" font-family="Arial" font-size="12" fill="#333" text-anchor="start">Output Processing</text>
  
  <!-- Arrow definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
</svg>